[project]
name = "langgraph-chatbot"
version = "0.1.0"
description = "A simple LangGraph-based chatbot with a Streamlit frontend powered by Groq"
readme = "README.md"
authors = [
    { name = "Ramkrishna Rathore", email = "luckyrathore70495@kgpian.iitkgp.ac.in" }
]
requires-python = ">=3.12"
dependencies = [
    "langgraph",
    "langchain",
    "langchain-groq",
    "python-dotenv",
    "streamlit",
    "pydantic",
]

[project.scripts]
langgraph-chatbot = "langgraph_chatbot:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
